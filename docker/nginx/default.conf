fastcgi_cache_path /var/cache/nginx/public levels=1:2 keys_zone=squadex_public:16m inactive=10m max_size=128m use_temp_path=off;

server {
    listen 8080 default_server;
    server_name _;

    return 444;
}

server {
    listen 8080;
    server_name www.sqaudex.com;

    return 308 https://sqaudex.com$request_uri;
}

server {
    listen 8080;
    server_name sqaudex.com;

    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $public_php_upstream public-php:9000;

    location ^~ /build/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public" always;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $public_php_upstream;
        fastcgi_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $public_php_upstream;
        fastcgi_read_timeout 30s;
        fastcgi_cache squadex_public;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 5m;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 3s;
        fastcgi_cache_background_update on;
        fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
        add_header X-Public-Cache $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
